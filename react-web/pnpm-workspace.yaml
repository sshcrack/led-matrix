allowBuilds:
  esbuild: false

onlyBuiltDependencies:
  - esbuild

# Security overrides for transitive build-time deps (workbox-build, eslint)
# whose parents have not yet adopted the patched majors.
overrides:
  glob@>=9 <14.0.2: ^14.0.3
  minimatch@<11.0.1: ^11.0.4
  serialize-javascript@<7.1.3: ^7.1.3
