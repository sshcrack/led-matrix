# Static relay for the LED matrix Spotify OAuth redirect.
# Deployed at /etc/nginx/sites-available/sshcrack/spotify-auth.sshcrack.me.conf on the reverse proxy,
# page at /var/www/spotify-auth/index.html. See hosted/spotify-auth/README.md.
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             spotify-auth.sshcrack.me;

    ssl_certificate         /etc/letsencrypt/live/spotify-auth.sshcrack.me/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spotify-auth.sshcrack.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spotify-auth.sshcrack.me/chain.pem;

    root /var/www/spotify-auth;

    # The URL carries a one-time auth code: never leak it or cache it.
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cache-Control             "no-store" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy   "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    access_log off;   # never write auth codes to disk

    location = /callback { try_files /index.html =404; }
    location = /         { try_files /index.html =404; }
    location /           { return 404; }
}

server {
    listen      80;
    listen      [::]:80;
    server_name spotify-auth.sshcrack.me;
    include     nginxconfig.io/letsencrypt.conf;
    location / { return 301 https://spotify-auth.sshcrack.me$request_uri; }
}
