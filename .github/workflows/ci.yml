name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  react-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "react-web/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: react-web
        run: pnpm install

      - name: Lint
        working-directory: react-web
        run: pnpm run lint:ci

      - name: Test
        working-directory: react-web
        run: pnpm run test

      - name: Build
        working-directory: react-web
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: react-web/dist/

  build:
    needs: react-web
    uses: ./.github/workflows/build-matrix.yml
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  artifact-comment:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && always() && needs.build.result == 'success'
    steps:
      - name: Post or update PR comment from artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          header="## Build Artifacts"
          body=$'## Build Artifacts\n\n| Platform | Download | Archive size |\n|---|---|---|'
          artifacts=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | endswith("-build")) | [.name, .id, (.size_in_bytes / 1048576 | floor)] | @tsv')
          while IFS=$'\t' read -r name id size; do
            [[ -n "$name" ]] || continue
            body+=$'\n'"| $name | [Download](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts/$id) | $size MiB |"
          done <<< "$artifacts"

          existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Build Artifacts"))) | .id' | head -1)
          jq -n --arg body "$body" '{body: $body}' > "$RUNNER_TEMP/artifact-comment.json"
          if [[ -n "$existing" ]]; then
            gh api "repos/$GH_REPO/issues/comments/$existing" -X PATCH --input "$RUNNER_TEMP/artifact-comment.json" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -X POST --input "$RUNNER_TEMP/artifact-comment.json" > /dev/null
          fi
