name: CI

on:
  push:
    branches: [master]
  # Every base branch, so stacked PRs (based on another PR's branch) are built too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  repo-size:
    # Stops big binaries / mass GIF regenerations from bloating clone size.
    # See scripts/check_repo_size.sh and .repo-size-allow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check added file sizes
        run: scripts/check_repo_size.sh "origin/${{ github.base_ref }}"

  cpp-format:
    # Only the C++ lines a PR changes are checked (no mass reformat); see scripts/check_cpp_format.sh.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: pipx install clang-format==21.1.8

      - name: Check formatting of changed C++ lines
        run: scripts/check_cpp_format.sh "origin/${{ github.base_ref }}"

  react-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "react-web/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: react-web
        run: pnpm install

      - name: Lint
        working-directory: react-web
        run: pnpm run lint:ci

      - name: Test
        working-directory: react-web
        run: pnpm run test

      - name: Build
        working-directory: react-web
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: react-web/dist/

  build:
    needs: react-web
    uses: ./.github/workflows/build-matrix.yml
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # Keeps a "Build artifacts" section in the PR description up to date instead of
  # posting a comment: description edits send no notification emails, however
  # often CI runs.
  pr-build-files:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && always() && needs.build.result == 'success'
    steps:
      - name: Write build artifacts section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### 📦 Build artifacts"
            echo ""
            echo "Built from \`${HEAD_SHA:0:7}\` · [CI run]($RUN_URL)"
            echo ""
            echo "| Platform | Download | Archive size |"
            echo "|---|---|---|"
            gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | endswith("-build")) | "| \(.name) | [Download]('"$RUN_URL"'/artifacts/\(.id)) | \(.size_in_bytes / 1048576 | floor) MiB |"' \
              | sort
          } > "$RUNNER_TEMP/build-files.md"
          cat "$RUNNER_TEMP/build-files.md"

      - name: Update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the current description right before writing, so recent author edits are kept.
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          python3 - "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/build-files.md" <<'PY'
          import re, sys

          body_path, section_path = sys.argv[1], sys.argv[2]
          start, end = "<!-- build-artifacts:start -->", "<!-- build-artifacts:end -->"
          body = open(body_path, encoding="utf-8").read().rstrip("\n")
          section = open(section_path, encoding="utf-8").read().strip()
          block = f"{start}\n{section}\n{end}"
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.S)
          if pattern.search(body):
              body = pattern.sub(lambda _: block, body)
          else:
              body = f"{body}\n\n---\n{block}" if body else block
          open(body_path, "w", encoding="utf-8").write(body + "\n")
          PY
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/body.md"

      # Runs once per PR that still has a comment from the previous mechanism.
      - name: Remove outdated build artifact comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Build Artifacts"))) | .id' \
            | xargs -r -n1 gh api "repos/$GH_REPO/issues/comments/{}" -X DELETE
