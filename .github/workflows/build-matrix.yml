name: Build Matrix Reusable

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: "led-matrix"
            os: ubuntu-latest
            preset: "cross-compile"
            artifact-name: "led-matrix-build"
            requires-toolchain: true
          - name: "desktop-linux"
            os: ubuntu-latest
            preset: "desktop-linux"
            artifact-name: "desktop-linux-build"
            requires-toolchain: false
          - name: "emulator-tests"
            os: ubuntu-latest
            preset: "emulator"
            artifact-name: "emulator-tests"
            requires-toolchain: false
          - name: "emulator-sanitizers"
            os: ubuntu-latest
            preset: "emulator"
            artifact-name: "emulator-sanitizers"
            requires-toolchain: false
          - name: "desktop-windows"
            os: windows-latest
            preset: "desktop-windows"
            artifact-name: "desktop-windows-build"
            requires-toolchain: false
    env:
      BUILD_TYPE: RelWithDebInfo
      # A runner's newer system CMake changes every vcpkg package ABI.
      VCPKG_FORCE_DOWNLOADED_BINARIES: '1'
      SCCACHE_LOG: warn
      SCCACHE_GHA_ENABLED: "true"
      # Avoid duplicating every compiler object into each PR's isolated scope.
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: ${{ matrix.name }}
    steps:
      # README/docs GIFs are not build inputs; sparse checkout also enables a
      # blobless partial clone, so those ~50 MiB are never transferred.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/plugins/*/img/
            !/docs/*.gif
          sparse-checkout-cone-mode: false

      # Submodules are pinned to non-tip commits; fetch exactly those commits.
      - name: Fetch submodules
        shell: bash
        run: git submodule update --init --depth 1 --recursive --jobs 4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: react-web/dist/

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        # choco exits 0 even when the community feed times out, so retry and verify makensis exists.
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install nsis -y --no-progress
            if ($candidates | Where-Object { Test-Path $_ }) { Write-Host "NSIS installed"; exit 0 }
            Write-Warning "NSIS not found after attempt $attempt; retrying"
            Start-Sleep -Seconds (20 * $attempt)
          }
          throw "NSIS installation failed after 4 attempts"

      - name: Refresh apt package lists
        if: runner.os != 'Windows'
        run: sudo apt-get update

      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: runner.os != 'Windows'
        with:
          packages: libasound2-dev python3-jinja2 pkg-config autoconf autoconf-archive automake libtool python3 linux-libc-dev curl libltdl-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libglu1-mesa-dev libibus-1.0-dev libxrandr-dev libxrandr2 wayland-protocols extra-cmake-modules xorg-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libayatana-appindicator3-dev
          version: 1.1

      - name: Identify dependency cache generation
        shell: bash
        run: |
          echo "VCPKG_CACHE_IMAGE=${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      # vcpkg does not copy NuGet restores into its files-cache provider.
      # Save the installed tree too, with an exact configuration/image key.
      - name: Cache installed vcpkg dependencies
        id: installed-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ matrix.preset == 'cross-compile' && 'build/vcpkg_installed' || startsWith(matrix.name, 'emulator-') && 'emulator_build/vcpkg_installed' || 'desktop_build/vcpkg_installed' }}
          key: ${{ runner.os }}-vcpkg-installed-v1-${{ matrix.preset }}-${{ env.VCPKG_CACHE_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/PI.cmake', 'cmake/overlay-ports/**', 'plugins/**/overlay-ports/**', 'cmake/triplets/**') }}

      # Mono/NuGet are only needed when dependencies must be restored or published.
      - name: Install Mono and synchronize certificate stores
        if: runner.os != 'Windows' && steps.installed-dependencies.outputs.cache-hit != 'true'
        run: bash scripts/setup_mono_certificates.sh

      - name: Configure compiler cache diagnostics
        shell: bash
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-errors.log" >> "$GITHUB_ENV"

      - name: Cache compiler results
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"

      # run-vcpkg and vcpkg's git registry otherwise fetch the full
      # microsoft/vcpkg history (1-2 minutes per job). Only the pinned
      # baseline tree is needed: every port version resolved from the
      # baseline lives in that commit. vcpkg's later `fetch HEAD` into the
      # shallow registry cache then only transfers the newest commit.
      - name: Seed shallow vcpkg checkouts
        shell: bash
        run: |
          baseline=$(jq -r '."default-registry".baseline' vcpkg-configuration.json)
          registry=$(jq -r '."default-registry".repository' vcpkg-configuration.json)
          git init -q vcpkg
          git -C vcpkg fetch -q --depth 1 "$registry" "$baseline"
          git -C vcpkg -c advice.detachedHead=false checkout -q FETCH_HEAD
          cache="$RUNNER_TEMP/vcpkg-registries"
          echo "X_VCPKG_REGISTRIES_CACHE=$cache" >> "$GITHUB_ENV"
          git init -q "$cache/git"
          git -C "$cache/git" fetch -q --depth 1 "$registry" HEAD "$baseline"

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgConfigurationJsonGlob: "vcpkg-configuration.json"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ matrix.preset }}-${{ env.VCPKG_CACHE_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/PI.cmake', 'cmake/overlay-ports/**', 'plugins/**/overlay-ports/**', 'cmake/triplets/**') }}
          restore-keys: ${{ runner.os }}-vcpkg-${{ matrix.preset }}-

      - name: Configure NuGet publishing key (Linux)
        if: runner.os != 'Windows' && steps.installed-dependencies.outputs.cache-hit != 'true'
        shell: bash
        env:
          VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: https://nuget.sshcrack.me/v3/index.json
        run: |
          NUGET_EXE=$($VCPKG_EXE fetch nuget | tail -n 1)
          mono "$NUGET_EXE" setapikey "$NUGET_API_KEY" -Source "$FEED_URL"
          # Probe the actual Mono/NuGet TLS path before vcpkg starts its restores.
          timeout 45 mono "$NUGET_EXE" search led-matrix-tls-probe -Source "$FEED_URL" -NonInteractive || \
            echo "::warning::NuGet probe failed; vcpkg will try the available cache providers and source builds"

      - name: Configure NuGet publishing key (Windows)
        if: runner.os == 'Windows' && steps.installed-dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: https://nuget.sshcrack.me/v3/index.json
        run: |
          $output = & $env:VCPKG_EXE fetch nuget
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not fetch NuGet" }
          $nuget = ($output | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath $nuget -PathType Leaf)) {
            throw "vcpkg did not return a NuGet executable path"
          }
          & $nuget setapikey $env:NUGET_API_KEY -Source $env:FEED_URL
          if ($LASTEXITCODE -ne 0) { throw "NuGet API-key setup failed" }

      - name: Cache cross-compile toolchain
        if: matrix.requires-toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cross-compile
          key: cross-compile-toolchain-v0.0.1-beta

      - name: Download and extract cross-compile toolchain
        if: matrix.requires-toolchain && steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/cross-compile
          cd ${{ runner.temp }}/cross-compile
          wget -O cross-compile.tar.xz "https://github.com/sshcrack/led-matrix/releases/download/v0.0.1-beta/cross-compile.tar.xz"
          tar -xvf cross-compile.tar.xz
          rm cross-compile.tar.xz

      # Scene preview GIFs live in the rolling `scene-previews` release, not git.
      # They are installed into the package, so fail loudly if they are missing.
      - name: Fetch scene previews
        if: matrix.preset == 'cross-compile'
        shell: bash
        run: scripts/fetch_scene_previews.sh

      - name: Build ${{ matrix.name }}
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          # LED_MATRIX_WERROR makes a new warning in our own targets fail the job
          # (GCC: -Werror; MSVC: /W4 /WX, see cmake/Warnings.cmake).
          configurePresetAdditionalArgs: ${{ matrix.name == 'emulator-sanitizers' && '["-DSKIP_WEB_BUILD=ON", "-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache", "-DLED_MATRIX_SANITIZE=address"]' || '["-DSKIP_WEB_BUILD=ON", "-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache", "-DCMAKE_POLICY_DEFAULT_CMP0141=NEW", "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded", "-DLED_MATRIX_WERROR=ON"]' }}
          buildPreset: ${{ matrix.preset }}
          # emulator-tests uses Ninja's default parallelism (all runner cores) like
          # the other Linux jobs; a 2-job cap made its cold builds the slowest.
          buildPresetAdditionalArgs: ${{ matrix.name == 'emulator-sanitizers' && '["--parallel", "2", "--target", "media_fetch_probe", "media_utilities_smoke", "spotify_cover_lifecycle_smoke", "ambiance_packs_smoke", "automatic_director_smoke", "live_frame_snapshot_smoke", "scene_renderer_frame_hold_smoke", "transition_frame_hold_smoke", "desktop_producer_ownership_smoke", "runtime_inputs_smoke", "remote_render_smoke", "remote_scene_contract_smoke"]' || startsWith(matrix.name, 'emulator-') && '["--target", "all"]' || runner.os == 'Windows' && '["--target", "package", "--config", "RelWithDebInfo"]' || '["--target", "package"]' }}
        env:
          # Use readwrite so new port-versions are cached; BaGetter may
          # reject very large packages (e.g. hello-imgui) with 413, but
          # vcpkg logs this as a warning and the build still succeeds.
          # An exact installed-tree hit needs no restores, so leave NuGet (and Mono) out.
          VCPKG_BINARY_SOURCES: ${{ steps.installed-dependencies.outputs.cache-hit == 'true' && format('clear;files,{0}/vcpkg-binary-cache,readwrite', runner.temp) || format('clear;files,{0}/vcpkg-binary-cache,readwrite;nugettimeout,30;nuget,https://nuget.sshcrack.me/v3/index.json,readwrite', runner.temp) }}
          CROSS_COMPILE_ROOT: ${{ (matrix.requires-toolchain && format('{0}/cross-compile', runner.temp)) || '' }}

      - name: Run complete emulator suite
        if: matrix.name == 'emulator-tests'
        run: ctest --test-dir emulator_build --output-on-failure --parallel 2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless

      - name: Run desktop test suite
        if: matrix.name == 'desktop-linux'
        run: ctest --test-dir desktop_build --output-on-failure --parallel 2 --timeout 180
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless

      - name: Run memory and undefined-behavior regressions
        if: matrix.name == 'emulator-sanitizers'
        run: ctest --test-dir emulator_build --output-on-failure -R 'media_.*smoke|spotify_cover_lifecycle_smoke|ambiance_packs_smoke|automatic_director_smoke|live_frame_snapshot_smoke|scene_renderer_frame_hold_smoke|transition_frame_hold_smoke|desktop_producer_ownership_smoke|runtime_inputs_smoke|remote_render_smoke|remote_scene_contract_smoke'
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/scripts/sanitizers/ubsan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/sanitizers/lsan.supp

      - name: Record cache diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          sccache --show-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats.json"
          python scripts/summarize_cache_diagnostics.py

      - name: Upload cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-diagnostics-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/sccache-stats.json
            ${{ runner.temp }}/cache-diagnostics.json
          if-no-files-found: ignore

      - name: Upload test diagnostics
        if: always() && startsWith(matrix.name, 'emulator-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: emulator_build/Testing/Temporary/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.name }} artifacts
        if: ${{ !startsWith(matrix.name, 'emulator-') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.name == 'desktop-linux' && (inputs.version && format('desktop_build/led-matrix-desktop-{0}-Linux.tar.gz', inputs.version) || 'desktop_build/led-matrix-desktop-*-Linux.tar.gz') || '' }}
            ${{ matrix.name == 'desktop-linux' && (inputs.version && format('desktop_build/led-matrix-desktop-{0}-Linux.deb', inputs.version) || 'desktop_build/led-matrix-desktop-*-Linux.deb') || '' }}
            ${{ matrix.name == 'desktop-windows' && (inputs.version && format('desktop_build/led-matrix-desktop-{0}-win64.zip', inputs.version) || 'desktop_build/led-matrix-desktop-*-win64.zip') || '' }}
            ${{ matrix.name == 'desktop-windows' && (inputs.version && format('desktop_build/led-matrix-desktop-{0}-win64.exe', inputs.version) || 'desktop_build/led-matrix-desktop-*-win64.exe') || '' }}
            ${{ matrix.name == 'led-matrix' && (inputs.version && format('build/led-matrix-{0}-arm64.tar.gz', inputs.version) || 'build/led-matrix-*-arm64.tar.gz') || '' }}
            ${{ matrix.name == 'led-matrix' && (inputs.version && format('build/led-matrix-{0}_arm64.deb', inputs.version) || 'build/led-matrix-*_arm64.deb') || '' }}

  provenance:
    name: Record validated build source
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source tree and version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, re, subprocess
          version = re.search(r'set\(VERSION ([0-9.]+)\)', pathlib.Path('CMakeLists.txt').read_text()).group(1)
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          pathlib.Path('build-provenance.json').write_text(json.dumps({'source_tree': tree, 'version': version}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: build-provenance
          path: build-provenance.json
