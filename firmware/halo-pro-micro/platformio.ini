; Rear halo light firmware for the Pro Micro (ATmega32U4, 5 V, 16 MHz).
; Build:  pio run          Flash:  pio run -t upload   (see README.md first!)
[env:promicro]
platform = atmelavr@5.0.0
board = sparkfun_promicro16
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
; The protocol parser is shared with the Pi daemon (one definition).
build_flags =
    -I../../shared/matrix/include
    -DHALO_LED_PIN=6
    -DHALO_DEFAULT_LEDS=40
    -DHALO_MAX_LEDS=120
    -DHALO_MAX_MILLIAMPS=2500
    -DHALO_MA_PER_LED=60
    -DHALO_FAILSAFE_MS=3000
